version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: yolo_fluxq_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./yolo_fluxq.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./yolo_fluxq.db:/app/yolo_fluxq.db
      - ./backend/models:/app/backend/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: yolo_fluxq_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
